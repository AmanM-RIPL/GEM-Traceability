version: "3"

services:
  gem_trace_db_server:
    image: "postgres:14.0"
    container_name: gem_trace_db_server
    ports:
      - "5443:5432"
    environment:
      POSTGRES_USER: gem_trace_db
      POSTGRES_PASSWORD: gem_trace_db_password
      POSTGRES_DB: gem_trace_service
    volumes:
      - ./db-data/gem_trace_db_server/:/var/lib/postgresql/data


  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_ui
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - gem_trace_db_server